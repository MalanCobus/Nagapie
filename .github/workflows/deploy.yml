name: Deploy application
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency: nagapie-production-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish src/Nagapie.BraindumpLite.Api -c Release -o artifacts/publish
      # Separate deployment identity owns DDL. The App Service connection stays read/write only.
      # Failure stops deployment before replacing the running website.
      - name: Upgrade and validate database
        run: dotnet artifacts/publish/Nagapie.BraindumpLite.Api.dll --migrate
        env:
          ConnectionStrings__Nagapie: ${{ secrets.NAGAPIE_MIGRATION_CONNECTION }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: artifacts/publish
