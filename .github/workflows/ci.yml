name: Build and test
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CI-disposable-Sql-9271!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CI-disposable-Sql-9271!' -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      NAGAPIE_TEST_SQL: 'Server=localhost,1433;User ID=sa;Password=CI-disposable-Sql-9271!;Encrypt=True;TrustServerCertificate=True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/service-worker.test.mjs
      - run: dotnet restore
      - run: dotnet format whitespace Nagapie.BraindumpLite.sln --no-restore --verify-no-changes
      - run: dotnet test --no-restore --configuration Release
      - run: dotnet publish src/Nagapie.BraindumpLite.Api --configuration Release --no-restore --output artifacts/publish
