name: Deploy application
on:
  workflow_dispatch:
permissions:
  contents: read
# Serialize the entire release. Never interrupt an upgrade with a newer release.
concurrency:
  group: nagapie-production-deploy
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: application-${{ github.sha }}
          path: artifacts/publish
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check deployment configuration
        env:
          MIGRATION_CONNECTION: ${{ secrets.NAGAPIE_MIGRATION_CONNECTION }}
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          for setting in APP_NAME RESOURCE_GROUP MIGRATION_CONNECTION CLIENT_ID TENANT_ID SUBSCRIPTION_ID; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing production environment setting: $setting"
              exit 1
            fi
          done
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve target website
        run: |
          host=$(az webapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query defaultHostName -o tsv)
          test -n "$host"
          echo "APP_URL=https://$host" >> "$GITHUB_ENV"
      # Old JSON writers must stop before import. Keep maintenance through release
      # so an incompatible old binary cannot resume writes after schema changes.
      - name: Pause website for database upgrade
        id: pause
        run: az webapp stop --name "$APP_NAME" --resource-group "$RESOURCE_GROUP"
      - name: Upgrade and validate database
        run: dotnet artifacts/publish/Nagapie.BraindumpLite.Api.dll --migrate
        env:
          DOTNET_ENVIRONMENT: Production
          ConnectionStrings__Nagapie: ${{ secrets.NAGAPIE_MIGRATION_CONNECTION }}
      - name: Deploy the tested package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: artifacts/publish
      - name: Start website
        run: az webapp start --name "$APP_NAME" --resource-group "$RESOURCE_GROUP"
      - name: Verify application and database readiness
        run: |
          result=$(curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            --max-time 15 --retry-max-time 180 "$APP_URL/health/ready")
          if [ "$result" != "Healthy" ]; then
            echo "::error::The deployed website did not return a healthy database readiness result."
            exit 1
          fi
      - name: Keep an unsuccessful release offline
        if: ${{ !success() && steps.pause.outcome == 'success' }}
        run: |
          az webapp stop --name "$APP_NAME" --resource-group "$RESOURCE_GROUP"
          echo "::error::Release failed after entering maintenance. The site is stopped. Inspect the failed step and rerun the corrected release; do not roll back the database automatically."
