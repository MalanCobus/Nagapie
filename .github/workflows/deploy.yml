name: Deploy application
on:
  workflow_dispatch:
permissions:
  contents: read
# Serialize the entire release. Never interrupt an upgrade with a newer release.
concurrency:
  group: nagapie-production-deploy
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      SQL_SERVER: nagapie-cobus-sql
      SQL_RESOURCE_GROUP: nagapie-cobus
      SQL_FIREWALL_RULE: nagapie-deploy-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: application-${{ github.sha }}
          path: artifacts/publish
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check deployment configuration
        env:
          MIGRATION_CONNECTION: ${{ secrets.NAGAPIE_MIGRATION_CONNECTION }}
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          for setting in APP_NAME RESOURCE_GROUP MIGRATION_CONNECTION CLIENT_ID TENANT_ID SUBSCRIPTION_ID; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing production environment setting: $setting"
              exit 1
            fi
          done
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve target website
        run: |
          host=$(az webapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query defaultHostName -o tsv)
          test -n "$host"
          echo "APP_URL=https://$host" >> "$GITHUB_ENV"
      - name: Allow this runner to reach SQL
        id: sql_firewall
        run: |
          runner_ip=$(curl -4 --fail --silent --show-error --max-time 20 https://api.ipify.org)
          python3 -c 'import ipaddress,sys; ip=ipaddress.IPv4Address(sys.argv[1]); assert ip.is_global' "$runner_ip"
          az sql server firewall-rule create --resource-group "$SQL_RESOURCE_GROUP" \
            --server "$SQL_SERVER" --name "$SQL_FIREWALL_RULE" \
            --start-ip-address "$runner_ip" --end-ip-address "$runner_ip" --output none
      - name: Check database access before pausing website
        env:
          DOTNET_ENVIRONMENT: Production
          ConnectionStrings__Nagapie: ${{ secrets.NAGAPIE_MIGRATION_CONNECTION }}
          Database__ExpectedServer: nagapie-cobus-sql.database.windows.net
        run: dotnet artifacts/publish/Nagapie.BraindumpLite.Api.dll --check-database-connection
      # Old JSON writers must stop before import. Keep maintenance through release
      # so an incompatible old binary cannot resume writes after schema changes.
      - name: Pause website for database upgrade
        id: pause
        run: az webapp stop --name "$APP_NAME" --resource-group "$RESOURCE_GROUP"
      - name: Upgrade and validate database
        run: dotnet artifacts/publish/Nagapie.BraindumpLite.Api.dll --migrate
        env:
          DOTNET_ENVIRONMENT: Production
          ConnectionStrings__Nagapie: ${{ secrets.NAGAPIE_MIGRATION_CONNECTION }}
      # Attempt cleanup even if creation timed out after Azure accepted the rule.
      - name: Remove this runner's SQL firewall rule
        if: ${{ always() && (steps.sql_firewall.outcome == 'success' || steps.sql_firewall.outcome == 'failure' || steps.sql_firewall.outcome == 'cancelled') }}
        run: |
          for attempt in 1 2 3; do
            if az sql server firewall-rule delete --resource-group "$SQL_RESOURCE_GROUP" \
              --server "$SQL_SERVER" --name "$SQL_FIREWALL_RULE" --output none; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Could not remove temporary SQL firewall rule $SQL_FIREWALL_RULE. Remove it on the SQL server Networking page."
          exit 1
      - name: Deploy the tested package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: artifacts/publish
      - name: Start website
        run: az webapp start --name "$APP_NAME" --resource-group "$RESOURCE_GROUP"
      - name: Verify application and database readiness
        run: |
          result=$(curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            --max-time 15 --retry-max-time 180 "$APP_URL/health/ready")
          if [ "$result" != "Healthy" ]; then
            echo "::error::The deployed website did not return a healthy database readiness result."
            exit 1
          fi
      - name: Keep an unsuccessful release offline
        if: ${{ !success() && steps.pause.outcome == 'success' }}
        run: |
          az webapp stop --name "$APP_NAME" --resource-group "$RESOURCE_GROUP"
          echo "::error::Release failed after entering maintenance. The site is stopped. Inspect the failed step and rerun the corrected release; do not roll back the database automatically."
